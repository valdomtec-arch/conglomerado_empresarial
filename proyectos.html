<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Obras y Proyectos - Conglomerado Empresarial</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; min-height: 100vh; }

    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .brand { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-nav { background: #334155; color: #fff; text-decoration: none; padding: 0.45rem 0.85rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
    .btn-nav:hover { background: #475569; }

    .container {
      max-width: 1440px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 480px 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 1080px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group { margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--text); }
    input, select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    /* Contenedor del Mapa */
    #map-preview {
      width: 100%;
      height: 230px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 0.6rem;
      z-index: 10;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-danger:hover { background: #fca5a5; }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.75rem; }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .data-table th {
      background: #f1f5f9;
      padding: 0.65rem;
      text-align: left;
      border: 1px solid var(--border);
      color: #475569;
    }
    .data-table td {
      padding: 0.65rem;
      border: 1px solid var(--border);
      vertical-align: middle;
    }

    .badge-status {
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-inactive { background: #fee2e2; color: #b91c1c; }

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
      z-index: 9999;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span>Gestión de Obras y Proyectos</span>
    </div>
    <div class="header-actions">
      <span id="user-display" style="font-size: 0.85rem; color: #94a3b8;">Verificando credenciales...</span>
      <a href="./control_obra.html" class="btn-nav">Tablero Central</a>
      <a href="./checador.html" class="btn-nav">Checador</a>
    </div>
  </header>

  <div class="container">

    <!-- COLUMNA 1: Formulario Alta / Edición con Mapa -->
    <div>
      <div class="card">
        <div class="card-title">
          <span id="form-title">Registrar Nuevo Frente de Obra</span>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-edit" style="display: none;">Cancelar</button>
        </div>

        <form id="form-proyecto">
          <input type="hidden" id="edit-doc-id" value="">

          <div class="grid-2">
            <div class="form-group">
              <label for="inp-codigo">Código de Obra</label>
              <input type="text" id="inp-codigo" placeholder="Ej. CARP-125-124" required>
            </div>
            <div class="form-group">
              <label for="select-cliente">Empresa / Cliente Titular</label>
              <select id="select-cliente" required>
                <option value="">Cargando empresas...</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="inp-nombre">Nombre Oficial del Proyecto</label>
            <input type="text" id="inp-nombre" placeholder="Ej. Excavación y Sembrado de Postes" required>
          </div>

          <!-- Parámetros de Geocerca GPS y Mapa Interactivo -->
          <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem; margin-bottom: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
              <span style="font-size: 0.85rem; font-weight: 700; color: var(--primary);">Geocerca Perimetral de Marcaje</span>
              <button type="button" class="btn btn-secondary btn-sm" id="btn-auto-gps">📍 GPS Actual</button>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label for="inp-lat">Latitud</label>
                <input type="number" step="any" id="inp-lat" placeholder="23.531959" required>
              </div>
              <div class="form-group">
                <label for="inp-lng">Longitud</label>
                <input type="number" step="any" id="inp-lng" placeholder="-105.769358" required>
              </div>
            </div>

            <div class="form-group">
              <label for="inp-radio">Radio Permitido de Marcaje (Metros)</label>
              <input type="number" id="inp-radio" value="150" min="10" max="5000" required>
            </div>

            <!-- Mapa Leaflet -->
            <label style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.2rem;">
              Haz clic en el mapa o arrastra el marcador para fijar la ubicación del proyecto:
            </label>
            <div id="map-preview"></div>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-submit-proyecto">Guardar Obra en Firestore</button>
        </form>
      </div>
    </div>

    <!-- COLUMNA 2: Padrón de Obras en Tiempo Real -->
    <div>
      <div class="card">
        <div class="card-title">
          <span>Obras Activas en el Ecosistema</span>
          <span id="count-obras" style="font-size: 0.8rem; color: var(--text-muted);">0 Registros</span>
        </div>

        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre del Proyecto</th>
                <th>Cliente / Titular</th>
                <th>Geocerca (Radio)</th>
                <th>Estatus</th>
                <th style="text-align: center;">Acción</th>
              </tr>
            </thead>
            <tbody id="proyectos-table-body">
              <tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 1.5rem 0;">Consultando proyectos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <div id="toast"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script type="module">
    import { 
      db, 
      collection, 
      addDoc, 
      setDoc, 
      doc, 
      updateDoc, 
      onSnapshot 
    } from "./js/firebase-config.js";
    import { protegerVista } from "./js/rbac.js";

    const selectCliente = document.getElementById("select-cliente");
    const formProyecto = document.getElementById("form-proyecto");
    const editDocId = document.getElementById("edit-doc-id");
    const inpCodigo = document.getElementById("inp-codigo");
    const inpNombre = document.getElementById("inp-nombre");
    const inpLat = document.getElementById("inp-lat");
    const inpLng = document.getElementById("inp-lng");
    const inpRadio = document.getElementById("inp-radio");
    const btnSubmit = document.getElementById("btn-submit-proyecto");
    const btnCancelEdit = document.getElementById("btn-cancel-edit");
    const btnAutoGps = document.getElementById("btn-auto-gps");
    const formTitle = document.getElementById("form-title");
    const tbody = document.getElementById("proyectos-table-body");
    const countObras = document.getElementById("count-obras");
    const toast = document.getElementById("toast");

    let usuarioActual = null;
    let perfilActual = null;
    let empresasList = [];
    let proyectosList = [];

    // Variables de Leaflet
    let map = null;
    let marker = null;
    let circle = null;
    const COORDS_DEFAULT = [23.531959, -105.769358];

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3200);
    }

    async function logEvento(accion, detalle) {
      try {
        await addDoc(collection(db, "auditoria"), {
          timestamp: new Date().toISOString(),
          uid: usuarioActual?.uid || "root",
          usuario: perfilActual?.nombre || usuarioActual?.email || "Super Admin",
          modulo: "proyectos",
          accion,
          detalle
        });
      } catch (err) {
        console.warn("Fallo log auditoría:", err);
      }
    }

    // 1. Inicialización del Mapa Leaflet
    function inicializarMapa() {
      map = L.map('map-preview').setView(COORDS_DEFAULT, 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      marker = L.marker(COORDS_DEFAULT, { draggable: true }).addTo(map);
      circle = L.circle(COORDS_DEFAULT, {
        color: '#2563eb',
        fillColor: '#3b82f6',
        fillOpacity: 0.25,
        radius: 150
      }).addTo(map);

      // Sincronizar inputs cuando se arrastra el marcador
      marker.on('dragend', function (e) {
        const pos = marker.getLatLng();
        actualizarCoordenadasEnInputs(pos.lat, pos.lng);
      });

      // Sincronizar inputs cuando se hace clic en cualquier punto del mapa
      map.on('click', function (e) {
        actualizarCoordenadasEnInputs(e.latlng.lat, e.latlng.lng);
      });

      // Inicializar con valores default en inputs
      inpLat.value = COORDS_DEFAULT[0];
      inpLng.value = COORDS_DEFAULT[1];
    }

    function actualizarMapaDesdeInputs() {
      const lat = parseFloat(inpLat.value);
      const lng = parseFloat(inpLng.value);
      const radio = parseInt(inpRadio.value, 10) || 150;

      if (!isNaN(lat) && !isNaN(lng) && map && marker && circle) {
        const newLatLng = new L.LatLng(lat, lng);
        marker.setLatLng(newLatLng);
        circle.setLatLng(newLatLng);
        circle.setRadius(radio);
        map.panTo(newLatLng);
      }
    }

    function actualizarCoordenadasEnInputs(lat, lng) {
      inpLat.value = Number(lat.toFixed(6));
      inpLng.value = Number(lng.toFixed(6));
      actualizarMapaDesdeInputs();
    }

    inpLat.addEventListener("input", actualizarMapaDesdeInputs);
    inpLng.addEventListener("input", actualizarMapaDesdeInputs);
    inpRadio.addEventListener("input", actualizarMapaDesdeInputs);

    // 2. Proteger Vista (RBAC - Ver proyectos)
    protegerVista("proyectos", "r").then(({ user, perfil }) => {
      usuarioActual = user;
      perfilActual = perfil;
      document.getElementById("user-display").textContent = perfil.nombre || user.email;

      inicializarMapa();
      cargarEmpresas();
      escucharProyectos();
    });

    // 3. Cargar Empresas Matriz
    function cargarEmpresas() {
      onSnapshot(collection(db, "empresas"), (snap) => {
        selectCliente.innerHTML = '<option value="">-- Selecciona Empresa Titular --</option>';
        empresasList = [];

        snap.forEach(d => {
          const emp = d.data();
          if (emp.activo !== false) {
            empresasList.push({ id: d.id, ...emp });
            const opt = document.createElement("option");
            opt.value = emp.razonSocial || emp.id;
            opt.textContent = `${emp.razonSocial} (${emp.rfc || d.id})`;
            selectCliente.appendChild(opt);
          }
        });
      });
    }

    // 4. Captura automática de coordenadas vía GPS
    btnAutoGps.addEventListener("click", () => {
      if (!navigator.geolocation) return alert("Geolocalización no soportada por el navegador.");
      btnAutoGps.textContent = "Obteniendo...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          actualizarCoordenadasEnInputs(pos.coords.latitude, pos.coords.longitude);
          btnAutoGps.textContent = "📍 GPS Actual";
          showToast("Ubicación GPS sincronizada en el mapa");
        },
        (err) => {
          alert("Error al obtener GPS: " + err.message);
          btnAutoGps.textContent = "📍 GPS Actual";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // 5. Guardar / Actualizar Obra en Firestore
    formProyecto.addEventListener("submit", async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;

      const payload = {
        codigo: inpCodigo.value.trim().toUpperCase(),
        nombre: inpNombre.value.trim(),
        cliente: selectCliente.value.trim(),
        lat: parseFloat(inpLat.value),
        lng: parseFloat(inpLng.value),
        radio_metros: parseInt(inpRadio.value, 10) || 150,
        activo: true,
        actualizadoEn: new Date().toISOString()
      };

      try {
        if (editDocId.value) {
          await updateDoc(doc(db, "proyectos", editDocId.value), payload);
          await logEvento("modificar_obra", `Actualizado proyecto ${payload.codigo} - ${payload.nombre}`);
          showToast("Proyecto actualizado exitosamente");
        } else {
          await addDoc(collection(db, "proyectos"), payload);
          await logEvento("alta_obra", `Registrado nuevo proyecto ${payload.codigo} - ${payload.nombre}`);
          showToast("Proyecto guardado en Firestore");
        }
        resetFormulario();
      } catch (err) {
        console.error("Error al guardar proyecto:", err);
        alert("Fallo al guardar: " + err.message);
      } finally {
        btnSubmit.disabled = false;
      }
    });

    function resetFormulario() {
      formProyecto.reset();
      editDocId.value = "";
      inpRadio.value = "150";
      formTitle.textContent = "Registrar Nuevo Frente de Obra";
      btnSubmit.textContent = "Guardar Obra en Firestore";
      btnCancelEdit.style.display = "none";
      actualizarCoordenadasEnInputs(COORDS_DEFAULT[0], COORDS_DEFAULT[1]);
    }

    btnCancelEdit.addEventListener("click", resetFormulario);

    // 6. Escuchar Proyectos en Tiempo Real
    function escucharProyectos() {
      onSnapshot(collection(db, "proyectos"), (snap) => {
        tbody.innerHTML = "";
        proyectosList = [];

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 1.5rem 0;">Sin obras registradas en el sistema.</td></tr>';
          countObras.textContent = "0 Registros";
          return;
        }

        snap.forEach(d => {
          const p = { id: d.id, ...d.data() };
          proyectosList.push(p);

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><code><strong>${p.codigo || 'S/C'}</strong></code></td>
            <td><strong>${p.nombre}</strong></td>
            <td>${p.cliente || 'Sin titular'}</td>
            <td>
              <small style="color: var(--text-muted);">
                (${p.lat?.toFixed(4)}, ${p.lng?.toFixed(4)}) - <b>${p.radio_metros || 150}m</b>
              </small>
            </td>
            <td>
              <span class="badge-status ${p.activo !== false ? 'badge-active' : 'badge-inactive'}">
                ${p.activo !== false ? 'Activa' : 'Pausada'}
              </span>
            </td>
            <td style="text-align: center; white-space: nowrap;">
              <button class="btn btn-secondary btn-sm" onclick="window.editarObra('${d.id}')">Editar</button>
              <button class="btn ${p.activo !== false ? 'btn-danger' : 'btn-secondary'} btn-sm" onclick="window.conmutarEstatus('${d.id}', ${p.activo !== false})">
                ${p.activo !== false ? 'Pausar' : 'Activar'}
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        countObras.textContent = `${proyectosList.length} Registros`;
      });
    }

    // Funciones globales de tabla
    window.editarObra = (docId) => {
      const p = proyectosList.find(item => item.id === docId);
      if (!p) return;

      editDocId.value = docId;
      inpCodigo.value = p.codigo || "";
      inpNombre.value = p.nombre || "";
      selectCliente.value = p.cliente || "";
      inpLat.value = p.lat ?? COORDS_DEFAULT[0];
      inpLng.value = p.lng ?? COORDS_DEFAULT[1];
      inpRadio.value = p.radio_metros ?? 150;

      actualizarMapaDesdeInputs();

      formTitle.textContent = `Editando: ${p.codigo || p.nombre}`;
      btnSubmit.textContent = "Actualizar Proyecto";
      btnCancelEdit.style.display = "inline-flex";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.conmutarEstatus = async (docId, activoActual) => {
      try {
        await updateDoc(doc(db, "proyectos", docId), { activo: !activoActual });
        await logEvento("estatus_obra", `Proyecto ${docId} cambiado a activo=${!activoActual}`);
        showToast("Estatus de la obra actualizado");
      } catch (err) {
        alert("Error al cambiar estatus: " + err.message);
      }
    };
  </script>
</body>
</html>
