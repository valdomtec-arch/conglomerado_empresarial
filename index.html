<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Conglomerado Empresarial</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .brand-icon {
      width: 58px;
      height: 58px;
      background: #eff6ff;
      color: var(--accent);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.45rem; color: var(--text); font-weight: 800; margin-bottom: 0.35rem; }
    p.subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 2rem; }
    .form-group { text-align: left; margin-bottom: 1.15rem; }
    label { display: block; font-size: 0.83rem; font-weight: 600; color: var(--text); margin-bottom: 0.35rem; }
    .password-wrapper { position: relative; display: flex; align-items: center; }
    input {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .password-wrapper input { padding-right: 2.75rem; }
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      transition: color 0.2s;
    }
    .toggle-password:hover { color: var(--accent); }
    .btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: #ffffff;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .status-msg {
      padding: 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      text-align: left;
    }
    .status-error { background: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; }
    .status-success { background: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; }
    .loading-spinner {
      display: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }
    .forgot-link-wrapper {
      margin-top: 1.25rem;
      font-size: 0.84rem;
      color: var(--text-muted);
    }
    .forgot-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
    </div>

    <h1>Acceso al Sistema</h1>
    <p class="subtitle">Conglomerado Empresarial</p>

    <div id="status-box" class="status-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Corporativo</label>
        <input type="email" id="email" required placeholder="usuario@conglomerado.com" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-password" id="btn-toggle-pwd" title="Mostrar/Ocultar contraseña">
            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn" id="btn-submit">Ingresar al Sistema</button>
      <div id="loading" class="loading-spinner">Verificando credenciales...</div>
    </form>

    <!-- Enlace para restablecimiento de contraseña -->
    <div class="forgot-link-wrapper">
      ¿Olvidaste tu contraseña? 
      <a href="javascript:void(0)" class="forgot-link" id="btn-forgot-password">Ingresa aquí para reponer tu clave</a>
    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      db, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      doc, 
      getDoc,
      setDoc
    } from "./js/firebase-config.js";

    // Función nativa de Firebase Auth para restablecer contraseña
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const SUPER_UID = "zeVjo7RcQqRKjq1T7goO22SMHip1";
    const SUPER_EMAIL = "valladarescid@gmail.com";

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const pwdInput = document.getElementById('password');
    const btnTogglePwd = document.getElementById('btn-toggle-pwd');
    const eyeIcon = document.getElementById('eye-icon');
    const statusBox = document.getElementById('status-box');
    const loading = document.getElementById('loading');
    const btnSubmit = document.getElementById('btn-submit');
    const btnForgot = document.getElementById('btn-forgot-password');

    function notify(msg, isError = true) {
      statusBox.textContent = msg;
      statusBox.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
      statusBox.style.display = 'block';
      loading.style.display = 'none';
      btnSubmit.disabled = false;
    }

    // 1. Control interactivo del ojito de contraseña
    btnTogglePwd.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';

      eyeIcon.innerHTML = isPassword
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    });

    // 2. Solicitud de reponer clave vía Auth
    btnForgot.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        notify("Por favor, ingresa tu correo corporativo en el campo de arriba para enviarte el enlace de recuperación.", true);
        emailInput.focus();
        return;
      }

      try {
        notify("Enviando enlace de restablecimiento...", false);
        await sendPasswordResetEmail(auth, email);
        notify(`Se ha enviado un correo a ${email} para reponer tu clave. Revisa tu bandeja de entrada o spam.`, false);
      } catch (err) {
        console.error("Error al restablecer contraseña:", err);
        let errorMsg = "No se pudo procesar la solicitud.";
        if (err.code === 'auth/user-not-found') {
          errorMsg = "No existe ninguna cuenta vinculada a este correo corporativo.";
        } else if (err.code === 'auth/invalid-email') {
          errorMsg = "El formato del correo corporativo no es válido.";
        }
        notify(errorMsg, true);
      }
    });

    // 3. Resolución de ruta: SIEMPRE aterriza en el Tablero Central (control_obra.html)
    async function resolverRutaUsuario(user) {
      loading.style.display = 'block';
      btnSubmit.disabled = true;

      const esRaiz = user.uid === SUPER_UID || (user.email && user.email.toLowerCase() === SUPER_EMAIL.toLowerCase());

      try {
        const refDoc = doc(db, "usuarios", user.uid);
        const snap = await getDoc(refDoc);

        if (esRaiz && !snap.exists()) {
          // Asegura la ficha técnica del Super Administrador si no existiera
          await setDoc(refDoc, {
            uid: user.uid,
            nombre: "Jose Antonio Valladares Cid",
            email: user.email,
            rol: "Super Administrador",
            rol_id: "superadmin",
            is_superadmin: true,
            alcance: "global",
            proyectos_asignados: ["*"],
            activo: true
          }, { merge: true });
        }

        // Todos los usuarios son dirigidos directamente al Tablero Central
        window.location.href = './control_obra.html';
      } catch (err) {
        console.warn("Fallo lectura de perfil, redirigiendo al tablero central:", err);
        window.location.href = './control_obra.html';
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        resolverRutaUsuario(user);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.style.display = 'none';
      loading.style.display = 'block';
      btnSubmit.disabled = true;

      const email = emailInput.value.trim();
      const password = pwdInput.value;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await resolverRutaUsuario(cred.user);
      } catch (err) {
        let msg = "Credenciales incorrectas.";
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          msg = "Correo o contraseña no válidos.";
        } else if (err.code === 'auth/too-many-requests') {
          msg = "Demasiados intentos fallidos. Intenta más tarde.";
        }
        notify(msg, true);
      }
    });
  </script>
</body>
</html>
