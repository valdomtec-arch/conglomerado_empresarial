<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Conglomerado Empresarial</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }

    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    h1 { font-size: 1.5rem; color: var(--text); font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem; }

    .form-group { text-align: left; margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }

    .password-wrapper input {
      padding-right: 2.75rem;
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
    }
    .toggle-password:hover { color: var(--text); }

    .actions-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -0.5rem;
      margin-bottom: 1.25rem;
    }

    .link-forgot {
      font-size: 0.82rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .link-forgot:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: #ffffff;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    .status-msg {
      padding: 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .status-error { background: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; }
    .status-success { background: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; }

    .loading-spinner {
      display: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    /* Modal Recuperación */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }
    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
      text-align: left;
    }
    .modal-box h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text); }
    .modal-box p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.4; }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .btn-cancel { background: #e2e8f0; color: #334155; }
    .btn-cancel:hover { background: #cbd5e1; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>

    <h1>Acceso al Sistema</h1>
    <p class="subtitle">Conglomerado Empresarial</p>

    <div id="status-box" class="status-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="usuario@conglomerado.com" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-password" id="btn-toggle-pwd" title="Mostrar/Ocultar contraseña">
            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="actions-row">
        <span class="link-forgot" id="link-forgot-modal">¿Olvidaste tu contraseña?</span>
      </div>

      <button type="submit" class="btn" id="btn-submit">Ingresar</button>
      <div id="loading" class="loading-spinner">Verificando credenciales...</div>
    </form>
  </div>

  <!-- Modal Recuperar Contraseña -->
  <div class="modal-backdrop" id="modal-forgot">
    <div class="modal-box">
      <h2>Restablecer Clave</h2>
      <p>Ingresa tu correo corporativo y te enviaremos un enlace de recuperación.</p>
      
      <div id="modal-status" class="status-msg"></div>

      <form id="form-forgot">
        <div class="form-group">
          <label for="forgot-email">Correo Electrónico</label>
          <input type="email" id="forgot-email" required placeholder="usuario@conglomerado.com">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" id="btn-close-modal">Cancelar</button>
          <button type="submit" class="btn" id="btn-send-reset">Enviar Enlace</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      db, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      doc, 
      getDoc, 
      setDoc 
    } from "./js/firebase-config.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const SUPERADMIN_EMAIL_ROOT = "valladarescid@gmail.com";

    const form = document.getElementById('login-form');
    const pwdInput = document.getElementById('password');
    const btnTogglePwd = document.getElementById('btn-toggle-pwd');
    const eyeIcon = document.getElementById('eye-icon');
    const statusBox = document.getElementById('status-box');
    const loading = document.getElementById('loading');
    const btnSubmit = document.getElementById('btn-submit');

    // Modal elements
    const modalForgot = document.getElementById('modal-forgot');
    const linkForgot = document.getElementById('link-forgot-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const formForgot = document.getElementById('form-forgot');
    const forgotEmail = document.getElementById('forgot-email');
    const modalStatus = document.getElementById('modal-status');
    const btnSendReset = document.getElementById('btn-send-reset');

    function notify(msg, isError = true) {
      statusBox.textContent = msg;
      statusBox.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
      statusBox.style.display = 'block';
      loading.style.display = 'none';
      btnSubmit.disabled = false;
    }

    // Toggle Mostrar/Ocultar Contraseña
    btnTogglePwd.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';

      eyeIcon.innerHTML = isPassword
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    });

    // Control del Modal de Recuperación
    linkForgot.addEventListener('click', () => {
      forgotEmail.value = document.getElementById('email').value.trim();
      modalStatus.style.display = 'none';
      modalForgot.style.display = 'flex';
    });

    btnCloseModal.addEventListener('click', () => {
      modalForgot.style.display = 'none';
    });

    formForgot.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = forgotEmail.value.trim();
      btnSendReset.disabled = true;
      modalStatus.style.display = 'none';

      try {
        await sendPasswordResetEmail(auth, email);
        modalStatus.textContent = "Correo enviado. Revisa tu bandeja de entrada o spam.";
        modalStatus.className = 'status-msg status-success';
        modalStatus.style.display = 'block';
        setTimeout(() => {
          modalForgot.style.display = 'none';
          btnSendReset.disabled = false;
        }, 3000);
      } catch (err) {
        modalStatus.textContent = "Error al enviar: verifica que el correo esté registrado.";
        modalStatus.className = 'status-msg status-error';
        modalStatus.style.display = 'block';
        btnSendReset.disabled = false;
      }
    });

    // Sembrado inicial si la BD está lista
    async function asegurarSuperAdmin(user) {
      if (user.email.toLowerCase() === SUPERADMIN_EMAIL_ROOT.toLowerCase()) {
        try {
          const userRef = doc(db, "usuarios", user.uid);
          const snap = await getDoc(userRef);

          if (!snap.exists() || !snap.data().is_superadmin) {
            await setDoc(userRef, {
              uid: user.uid,
              email: user.email,
              nombre: "Jose Antonio Valladares Cid",
              rol: "superadmin",
              rol_id: "superadmin",
              is_superadmin: true,
              alcance: "global",
              proyectos_asignados: ["*"],
              activo: true,
              creadoEn: new Date().toISOString()
            }, { merge: true });

            const modulosBase = [
              { id: "usuarios", nombre: "Gobernanza RBAC", ruta: "./admin.html" },
              { id: "proyectos", nombre: "Proyectos y Geocercas", ruta: "./proyectos.html" },
              { id: "checador", nombre: "Checador PWA", ruta: "./checador.html" },
              { id: "bitacora", nombre: "Bitácora de Avance", ruta: "./bitacora.html" },
              { id: "prenomina", nombre: "Prenómina M.O.", ruta: "./prenomina.html" },
              { id: "estimaciones", nombre: "Estimaciones de Cobro", ruta: "./estimaciones.html" }
            ];

            for (const m of modulosBase) {
              await setDoc(doc(db, "modulos", m.id), {
                nombre: m.nombre,
                ruta: m.ruta,
                activo: true
              }, { merge: true });
            }
          }
        } catch (dbErr) {
          console.warn("Firestore aún no accesible, omitiendo auto-sembrado:", dbErr);
        }
      }
    }

    async function redirectByRole(user) {
      loading.style.display = 'block';
      btnSubmit.disabled = true;

      // Si es el correo maestro, entra directo a admin.html sin trabarse por Firestore
      if (user.email.toLowerCase() === SUPERADMIN_EMAIL_ROOT.toLowerCase()) {
        await asegurarSuperAdmin(user);
        window.location.href = './admin.html';
        return;
      }

      try {
        const userDoc = await getDoc(doc(db, "usuarios", user.uid));
        if (userDoc.exists() && (userDoc.data().is_superadmin || userDoc.data().rol === 'superadmin' || userDoc.data().rol === 'admin')) {
          window.location.href = './admin.html';
        } else {
          window.location.href = './control_obra.html';
        }
      } catch (err) {
        window.location.href = './control_obra.html';
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        redirectByRole(user);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.style.display = 'none';
      loading.style.display = 'block';
      btnSubmit.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = pwdInput.value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        await redirectByRole(userCredential.user);
      } catch (err) {
        let msg = "Credenciales incorrectas.";
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          msg = "Correo o contraseña no válidos.";
        } else if (err.code === 'auth/too-many-requests') {
          msg = "Demasiados intentos fallidos. Restablece tu contraseña.";
        }
        notify(msg, true);
      }
    });
  </script>
</body>
</html>
