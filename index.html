<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Conglomerado Empresarial</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }

    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    h1 { font-size: 1.5rem; color: var(--text); font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem; }

    .form-group { text-align: left; margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      margin-top: 0.5rem;
      background: var(--primary);
      color: #ffffff;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    .error-msg {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fee2e2;
      padding: 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .loading-spinner {
      display: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>

    <h1>Acceso al Sistema</h1>
    <p class="subtitle">Conglomerado Empresarial</p>

    <div id="error-box" class="error-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="usuario@conglomerado.com" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn" id="btn-submit">Ingresar</button>
      <div id="loading" class="loading-spinner">Verificando credenciales...</div>
    </form>
  </div>

  <script type="module">
    import { 
      auth, 
      db, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      doc, 
      getDoc, 
      setDoc 
    } from "./js/firebase-config.js";

    // Correo raíz con privilegios de auto-sembrado inicial
    const SUPERADMIN_EMAIL_ROOT = "valladarescid@gmail.com";

    const form = document.getElementById('login-form');
    const errBox = document.getElementById('error-box');
    const loading = document.getElementById('loading');
    const btnSubmit = document.getElementById('btn-submit');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.style.display = 'block';
      loading.style.display = 'none';
      btnSubmit.disabled = false;
    }

    // Auto-sembrado inicial en Firestore si es la primera entrada
    async function asegurarSuperAdmin(user) {
      const userRef = doc(db, "usuarios", user.uid);
      const snap = await getDoc(userRef);

      // Si el usuario es el correo raíz y aún no tiene documento o no tiene perfil de superadmin
      if (user.email.toLowerCase() === SUPERADMIN_EMAIL_ROOT.toLowerCase()) {
        if (!snap.exists() || !snap.data().is_superadmin) {
          loading.textContent = "Sembrando estructura de Super Administrador...";
          
          // 1. Inyecta el perfil completo a la colección 'usuarios'
          await setDoc(userRef, {
            uid: user.uid,
            email: user.email,
            nombre: "Jose Antonio Valladares Cid",
            rol: "superadmin",
            rol_id: "superadmin",
            is_superadmin: true,
            alcance: "global",
            proyectos_asignados: ["*"],
            activo: true,
            creadoEn: new Date().toISOString()
          }, { merge: true });

          // 2. Inyecta el catálogo base inicial en la colección 'modulos'
          const modulosBase = [
            { id: "usuarios", nombre: "Gobernanza RBAC", ruta: "./admin.html" },
            { id: "proyectos", nombre: "Proyectos y Geocercas", ruta: "./proyectos.html" },
            { id: "checador", nombre: "Checador PWA", ruta: "./checador.html" },
            { id: "bitacora", nombre: "Bitácora de Avance", ruta: "./bitacora.html" },
            { id: "prenomina", nombre: "Prenómina M.O.", ruta: "./prenomina.html" },
            { id: "estimaciones", nombre: "Estimaciones de Cobro", ruta: "./estimaciones.html" }
          ];

          for (const m of modulosBase) {
            await setDoc(doc(db, "modulos", m.id), {
              nombre: m.nombre,
              ruta: m.ruta,
              activo: true
            }, { merge: true });
          }
        }
      }
    }

    // Enrutador inteligente
    async function redirectByRole(user) {
      loading.style.display = 'block';
      btnSubmit.disabled = true;

      try {
        // Ejecuta el auto-sembrado si corresponde
        await asegurarSuperAdmin(user);

        const userDoc = await getDoc(doc(db, "usuarios", user.uid));
        
        if (userDoc.exists()) {
          const data = userDoc.data();
          const esAdmin = data.is_superadmin === true || 
                          data.rol === 'admin' || 
                          data.rol === 'superadmin' || 
                          data.rol_id === 'superadmin';

          if (esAdmin) {
            window.location.href = './admin.html';
            return;
          }
        }
        
        // Perfil operativo regular
        window.location.href = './control_obra.html';
      } catch (err) {
        console.error("Error al evaluar sesión:", err);
        showError("Error de permisos en base de datos: " + err.message);
      }
    }

    // Sesión persistente
    onAuthStateChanged(auth, (user) => {
      if (user) {
        redirectByRole(user);
      }
    });

    // Envío del Login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      loading.style.display = 'block';
      loading.textContent = "Validando credenciales...";
      btnSubmit.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        await redirectByRole(userCredential.user);
      } catch (err) {
        console.error(err);
        let mensaje = "Error al autenticar. Verifica correo y contraseña.";
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          mensaje = "Credenciales incorrectas.";
        }
        showError(mensaje);
      }
    });
  </script>
</body>
</html>
