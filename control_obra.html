<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Obra - Tablero Central</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge-role {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      background: #334155;
      color: #93c5fd;
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn-nav {
      background: #1e293b;
      color: #fff;
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #334155;
      transition: background 0.2s;
    }
    .btn-nav:hover { background: #334155; }

    .main-content {
      max-width: 1400px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
      flex-grow: 1;
      width: 100%;
    }

    .dashboard-header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .welcome-title { font-size: 1.45rem; font-weight: 800; color: var(--primary); }
    .welcome-sub { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    /* Barra de KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: #eff6ff;
    }
    .kpi-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .kpi-val { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-top: 2px; }

    /* Grid de Módulos Dinámicos */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }
    .module-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .module-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      border-color: var(--accent);
    }
    .card-top { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
    .module-icon {
      font-size: 2rem;
      background: #f8fafc;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .module-info h3 { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .module-info p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.4; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      border-top: 1px solid #f1f5f9;
      padding-top: 0.85rem;
      margin-top: 0.5rem;
    }

    .btn-logout {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-logout:hover { background: #cbd5e1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Conglomerado Empresarial</span>
      <span class="badge-role" id="user-badge-role">Verificando...</span>
    </div>
    <div class="header-actions">
      <span id="user-name-display" style="font-size: 0.85rem; color: #94a3b8;"></span>
      <a href="./admin.html" id="link-admin" class="btn-nav" style="display: none;">Torre de Control</a>
      <button class="btn-logout" id="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <main class="main-content">
    <div class="dashboard-header">
      <div>
        <h1 class="welcome-title">Tablero Central de Operaciones</h1>
        <p class="welcome-sub" id="welcome-sub">Módulos operacionales autorizados en tiempo real.</p>
      </div>
      <div id="obras-scope-badge" style="font-size: 0.82rem; color: var(--text-muted); background: #fff; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);">
        Alcance: Verificando...
      </div>
    </div>

    <!-- Indicadores Clave en Vivo -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">🏗️</div>
        <div>
          <div class="kpi-title">Obras Autorizadas</div>
          <div class="kpi-val" id="kpi-obras">0</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">👷</div>
        <div>
          <div class="kpi-title">Personal en Sitio Hoy</div>
          <div class="kpi-val" id="kpi-asistencias">0</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">📝</div>
        <div>
          <div class="kpi-title">Estimaciones en Proceso</div>
          <div class="kpi-val" id="kpi-estimaciones">0</div>
        </div>
      </div>
    </div>

    <!-- Módulos Dinámicos desde Firestore -->
    <div class="modules-grid" id="modules-container">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem 0;">
        Consultando módulos autorizados en Firestore...
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db, signOut, collection, onSnapshot, query, where, doc, getDoc, setDoc } from "./js/firebase-config.js";

    const SUPER_UID = "zeVjo7RcQqRKjq1T7goO22SMHip1";
    const SUPER_EMAIL = "valladarescid@gmail.com";

    const modulesContainer = document.getElementById("modules-container");
    const userNameDisplay = document.getElementById("user-name-display");
    const userBadgeRole = document.getElementById("user-badge-role");
    const linkAdmin = document.getElementById("link-admin");
    const obrasScopeBadge = document.getElementById("obras-scope-badge");

    const kpiObras = document.getElementById("kpi-obras");
    const kpiAsistencias = document.getElementById("kpi-asistencias");
    const kpiEstimaciones = document.getElementById("kpi-estimaciones");

    // Catálogo con registro_usuarios integrado
    const ICONOS_DEFAULT = {
      proyectos: "📍",
      checador: "⏱️",
      bitacora: "📓",
      estimaciones: "📊",
      prenomina: "👥",
      registro_usuarios: "👤",
      usuarios: "⚙️"
    };

    const DESCRIPCIONES_DEFAULT = {
      proyectos: "Frentes de obra, geocercas GPS y empresas titulares.",
      checador: "Control de asistencia facial y verificación de perímetro.",
      bitacora: "Asientos diarios de obra, cuadrillas y supervisión.",
      estimaciones: "Carátulas de cobro financiero y retenciones de ley.",
      prenomina: "Liquidación semanal de mano de obra y exportación a CSV.",
      registro_usuarios: "Alta directa de colaboradores y credenciales de acceso.",
      usuarios: "Directorio de colaboradores y matriz de gobernanza."
    };

    // 1. Verificación de sesión y resolución de perfil
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "./index.html";
        return;
      }

      const esRaiz = user.uid === SUPER_UID || (user.email && user.email.toLowerCase() === SUPER_EMAIL.toLowerCase());
      
      let perfil = {
        uid: user.uid,
        email: user.email,
        nombre: user.displayName || user.email,
        rol: "Colaborador",
        is_superadmin: esRaiz,
        alcance: esRaiz ? "global" : "asignado",
        proyectos_asignados: esRaiz ? ["*"] : []
      };

      try {
        const snap = await getDoc(doc(db, "usuarios", user.uid));
        if (snap.exists()) {
          perfil = { ...perfil, ...snap.data() };
        }
      } catch (err) {
        console.warn("Fallo lectura de usuario en Firestore:", err);
      }

      // Si es Super Admin, garantizamos que el módulo registro_usuarios exista en Firestore
      if (esRaiz || perfil.is_superadmin) {
        asegurarModuloRegistroUsuarios();
      }

      // Si es colaborador operativo, obtenemos la matriz del rol asignado
      if (!perfil.is_superadmin && perfil.rol_id) {
        try {
          const rolSnap = await getDoc(doc(db, "roles", perfil.rol_id));
          if (rolSnap.exists()) {
            perfil.matriz = rolSnap.data().matriz || {};
          }
        } catch (e) {
          console.warn("Fallo lectura del rol:", e);
        }
      }

      iniciarInterfaz(user, perfil);
    });

    // Auto-registro para que nunca falte la tarjeta en el tablero
    async function asegurarModuloRegistroUsuarios() {
      try {
        const modRef = doc(db, "modulos", "registro_usuarios");
        const modSnap = await getDoc(modRef);
        if (!modSnap.exists()) {
          await setDoc(modRef, {
            id: "registro_usuarios",
            nombre: "Alta de Colaboradores",
            ruta: "./registro_usuarios.html",
            activo: true,
            icono: "👤",
            descripcion: "Alta directa de colaboradores y credenciales de acceso."
          }, { merge: true });
        }
      } catch (e) {
        console.warn("Auto-registro del módulo:", e);
      }
    }

    function iniciarInterfaz(user, perfil) {
      userNameDisplay.textContent = perfil.nombre || user.email;
      const esSuper = perfil.is_superadmin || perfil.rol_id === "superadmin" || perfil.rol === "superadmin";

      userBadgeRole.textContent = esSuper ? "SUPER ADMIN" : (perfil.rol || "COLABORADOR");
      if (esSuper) {
        linkAdmin.style.display = "inline-block";
        userBadgeRole.style.background = "#dc2626";
        userBadgeRole.style.color = "#fff";
      }

      obrasScopeBadge.textContent = esSuper || perfil.alcance === "global"
        ? "Alcance: Global (Todas las Obras)"
        : `Alcance: ${perfil.proyectos_asignados?.length || 0} Obra(s) Asignada(s)`;

      escucharKPIs(perfil, esSuper);
      escucharModulos(perfil, esSuper);
    }

    // 2. Evaluación de Acceso
    function evaluarAccesoModulo(perfil, moduloId, esSuper) {
      if (esSuper) return true;
      if (!perfil.matriz) return false;

      const perm = perfil.matriz[moduloId];
      if (!perm) return false;

      return perm.ver === true || perm.r === true;
    }

    // 3. Render reactivo de módulos desde Firestore
    function escucharModulos(perfil, esSuper) {
      onSnapshot(collection(db, "modulos"), (snap) => {
        modulesContainer.innerHTML = "";

        if (snap.empty) {
          modulesContainer.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">Sin módulos configurados en Firestore.</div>';
          return;
        }

        let visibles = 0;
        snap.forEach(d => {
          const m = { id: d.id, ...d.data() };
          const activo = m.activo !== false;
          const tienePermiso = evaluarAccesoModulo(perfil, m.id, esSuper);

          if (activo && tienePermiso) {
            visibles++;
            const icono = m.icono || ICONOS_DEFAULT[m.id] || "📁";
            const desc = m.descripcion || DESCRIPCIONES_DEFAULT[m.id] || "Acceso operacional al módulo.";

            const card = document.createElement("a");
            card.href = m.ruta;
            card.className = "module-card";
            card.innerHTML = `
              <div class="card-top">
                <div class="module-icon">${icono}</div>
                <div class="module-info">
                  <h3>${m.nombre || m.id}</h3>
                  <p>${desc}</p>
                </div>
              </div>
              <div class="card-footer">
                <span>Acceder al módulo</span>
                <span>→</span>
              </div>
            `;
            modulesContainer.appendChild(card);
          }
        });

        if (visibles === 0) {
          modulesContainer.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem 0;">No cuentas con módulos autorizados para tu rol actual.</div>';
        }
      }, (err) => {
        console.error("Error al escuchar módulos:", err);
      });
    }

    // 4. KPIs en Vivo
    function escucharKPIs(perfil, esSuper) {
      onSnapshot(collection(db, "proyectos"), (snap) => {
        let total = 0;
        snap.forEach(d => {
          const p = d.data();
          const permitido = esSuper || perfil.alcance === "global" || perfil.proyectos_asignados?.includes(d.id) || perfil.proyectos_asignados?.includes("*");
          if (permitido && p.activo !== false) total++;
        });
        kpiObras.textContent = total;
      });

      const hoy = new Date().toISOString().split("T")[0];
      const qAsist = query(
        collection(db, "asistencias"),
        where("fechaCorta", "==", hoy),
        where("tipo", "==", "entrada")
      );
      onSnapshot(qAsist, (snap) => {
        const uids = new Set();
        snap.forEach(d => uids.add(d.data().uid));
        kpiAsistencias.textContent = uids.size;
      });

      onSnapshot(collection(db, "estimaciones"), (snap) => {
        let countRev = 0;
        snap.forEach(d => {
          if (d.data().estado === "revision") countRev++;
        });
        kpiEstimaciones.textContent = countRev;
      });
    }

    document.getElementById("btn-logout").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "./index.html";
    });
  </script>
</body>
</html>
