<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Obra - Tablero de Módulos</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge-role {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      background: #334155;
      color: #93c5fd;
    }

    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn-nav {
      background: #1e293b;
      color: #fff;
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #334155;
      transition: background 0.2s;
    }
    .btn-nav:hover { background: #334155; }

    .main-content {
      max-width: 1400px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
      flex-grow: 1;
      width: 100%;
    }

    .dashboard-header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .welcome-title { font-size: 1.45rem; font-weight: 800; color: var(--primary); }
    .welcome-sub { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    /* Barra de KPIs en Tiempo Real */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: #eff6ff;
    }
    .kpi-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .kpi-val { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-top: 2px; }

    /* Grid de Módulos Dinámicos */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .module-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }
    .module-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      border-color: var(--accent);
    }

    .card-top { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
    .module-icon {
      font-size: 2.2rem;
      background: #f8fafc;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .module-info h3 { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .module-info p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.4; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      border-top: 1px solid #f1f5f9;
      padding-top: 0.85rem;
      margin-top: 0.5rem;
    }

    .btn-logout {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-logout:hover { background: #cbd5e1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Conglomerado Empresarial</span>
      <span class="badge-role" id="user-badge-role">Cargando...</span>
    </div>
    <div class="header-actions">
      <span id="user-name-display" style="font-size: 0.85rem; color: #94a3b8;"></span>
      <a href="./admin.html" id="link-admin" class="btn-nav" style="display: none;">Torre de Control</a>
      <button class="btn-logout" id="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <main class="main-content">
    <div class="dashboard-header">
      <div>
        <h1 class="welcome-title">Tablero Central de Operaciones</h1>
        <p class="welcome-sub" id="welcome-sub">Módulos operacionales autorizados en tiempo real.</p>
      </div>
      <div id="obras-scope-badge" style="font-size: 0.82rem; color: var(--text-muted); background: #fff; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);">
        Alcance: Verificando...
      </div>
    </div>

    <!-- KPIs en Tiempo Real -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">🏗️</div>
        <div>
          <div class="kpi-title">Obras Autorizadas</div>
          <div class="kpi-val" id="kpi-obras">0</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">👷</div>
        <div>
          <div class="kpi-title">Personal en Sitio Hoy</div>
          <div class="kpi-val" id="kpi-asistencias">0</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">📝</div>
        <div>
          <div class="kpi-title">Estimaciones en Proceso</div>
          <div class="kpi-val" id="kpi-estimaciones">0</div>
        </div>
      </div>
    </div>

    <!-- Contenedor Reactivo a Firestore -->
    <div class="modules-grid" id="modules-container">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem 0;">
        Sincronizando módulos desde Firestore...
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db, signOut, collection, onSnapshot, query, where } from "./js/firebase-config.js";
    import { obtenerPerfilActual, escucharModulosSistema, tienePermiso } from "./js/rbac.js";

    const modulesContainer = document.getElementById("modules-container");
    const userNameDisplay = document.getElementById("user-name-display");
    const userBadgeRole = document.getElementById("user-badge-role");
    const linkAdmin = document.getElementById("link-admin");
    const obrasScopeBadge = document.getElementById("obras-scope-badge");
    const welcomeSub = document.getElementById("welcome-sub");

    const kpiObras = document.getElementById("kpi-obras");
    const kpiAsistencias = document.getElementById("kpi-asistencias");
    const kpiEstimaciones = document.getElementById("kpi-estimaciones");

    async function inicializarDashboard() {
      try {
        const { user, perfil } = await obtenerPerfilActual();

        userNameDisplay.textContent = perfil.nombre || user.email;
        userBadgeRole.textContent = perfil.is_superadmin ? "SUPER ADMIN" : (perfil.rol || "COLABORADOR");

        if (perfil.is_superadmin) {
          linkAdmin.style.display = "inline-block";
          userBadgeRole.style.background = "#dc2626";
          userBadgeRole.style.color = "#fff";
        }

        if (perfil.empresaId) {
          welcomeSub.textContent = `Adscrito a empresa matriz [${perfil.empresaId}] | Módulos activos según gobernanza.`;
        }

        obrasScopeBadge.textContent = perfil.is_superadmin || perfil.alcance === "global"
          ? "Alcance: Global (Todas las Obras)"
          : `Alcance: ${perfil.proyectos_asignados?.length || 0} Obra(s) Asignada(s)`;

        // Iniciar métricas en vivo
        escucharKPIs(perfil);

        // Render Dinámico de Módulos (Reacciona a creación/pausa en admin.html)
        escucharModulosSistema((modulos) => {
          modulesContainer.innerHTML = "";

          if (!modulos || modulos.length === 0) {
            modulesContainer.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">Sin módulos configurados en la base de datos.</div>';
            return;
          }

          let modulosVisibles = 0;

          modulos.forEach(m => {
            // El módulo debe estar activo en la base y el colaborador debe tener permiso de lectura ('r' o 'ver')
            const tieneAcceso = perfil.is_superadmin || (m.activo !== false && tienePermiso(perfil, m.id, "r"));

            if (tieneAcceso) {
              modulosVisibles++;
              const card = document.createElement("a");
              card.href = m.ruta;
              card.className = "module-card";
              card.innerHTML = `
                <div class="card-top">
                  <div class="module-icon">${m.icono || '📁'}</div>
                  <div class="module-info">
                    <h3>${m.nombre}</h3>
                    <p>${m.descripcion || 'Acceso al módulo operativo de obra.'}</p>
                  </div>
                </div>
                <div class="card-footer">
                  <span>Acceder al módulo</span>
                  <span>→</span>
                </div>
              `;
              modulesContainer.appendChild(card);
            }
          });

          if (modulosVisibles === 0) {
            modulesContainer.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">No cuentas con módulos autorizados para tu puesto actual.</div>';
          }
        });

      } catch (err) {
        console.error("Acceso restringido o error de sesión:", err);
        window.location.href = "./index.html";
      }
    }

    // Escucha de métricas en tiempo real
    function escucharKPIs(perfil) {
      // 1. Obras activas
      onSnapshot(collection(db, "proyectos"), (snap) => {
        let count = 0;
        snap.forEach(d => {
          const p = d.data();
          const permitido = perfil.is_superadmin || 
                            perfil.alcance === "global" || 
                            perfil.proyectos_asignados?.includes(d.id) || 
                            perfil.proyectos_asignados?.includes("*");
          if (permitido && p.activo !== false) count++;
        });
        kpiObras.textContent = count;
      });

      // 2. Personal presente hoy
      const hoy = new Date().toISOString().split("T")[0];
      const qAsist = query(collection(db, "asistencias"), where("fechaCorta", "==", hoy));
      onSnapshot(qAsist, (snap) => {
        const uids = new Set();
        snap.forEach(d => {
          if (d.data().tipo === "entrada") uids.add(d.data().uid);
        });
        kpiAsistencias.textContent = uids.size;
      });

      // 3. Estimaciones en proceso
      onSnapshot(collection(db, "estimaciones"), (snap) => {
        let countRev = 0;
        snap.forEach(d => {
          if (d.data().estado === "revision") countRev++;
        });
        kpiEstimaciones.textContent = countRev;
      });
    }

    document.getElementById("btn-logout").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "./index.html";
    });

    inicializarDashboard();
  </script>
</body>
</html>
