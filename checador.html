<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checador de Asistencia - Conglomerado Empresarial</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; min-height: 100vh; }

    header {
      background: var(--primary);
      color: #fff;
      padding: 0.9rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .btn-exit { background: #334155; color: #fff; text-decoration: none; padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }

    .main-container {
      max-width: 480px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group { margin-bottom: 0.85rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--text); }
    select, input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }
    select:focus, input:focus { border-color: var(--accent); }

    /* Cámara & Foto */
    .camera-container {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, #captured-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #captured-preview { display: none; }
    
    .camera-actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    /* Indicador GPS */
    .geo-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 0.85rem;
      font-weight: 600;
      background: #f8fafc;
      border: 1px solid var(--border);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .badge-ok { background: #dcfce7; color: #15803d; }
    .badge-fail { background: #fee2e2; color: #b91c1c; }
    .badge-checking { background: #fef3c7; color: #b45309; }

    .tipo-marcado {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .radio-card {
      border: 1px solid var(--border);
      padding: 0.6rem;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .radio-card.selected {
      background: #eff6ff;
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }

    /* Feed Historial */
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.8rem;
    }
    .history-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span>Checador Móvil PWA</span>
    </div>
    <a href="./control_obra.html" class="btn-exit">Menú</a>
  </header>

  <div class="main-container">

    <!-- Formulario de Registro de Asistencia -->
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Registro de Presencia en Sitio</span>
      </div>

      <!-- Selección de Obra -->
      <div class="form-group">
        <label for="select-proyecto">Obra / Frente de Trabajo</label>
        <select id="select-proyecto">
          <option value="">Cargando proyectos autorizados...</option>
        </select>
      </div>

      <!-- Tipo de Checada -->
      <label>Tipo de Evento</label>
      <div class="tipo-marcado">
        <div class="radio-card selected" data-tipo="entrada" id="btn-tipo-entrada">🟢 Entrada</div>
        <div class="radio-card" data-tipo="salida" id="btn-tipo-salida">🔴 Salida</div>
      </div>

      <!-- Validación Geocerca GPS -->
      <div class="geo-status" id="geo-box">
        <div>
          <div>Ubicación Geocerca:</div>
          <small id="geo-distancia-label" style="color: var(--text-muted);">Calculando coordenadas...</small>
        </div>
        <span class="status-badge badge-checking" id="geo-badge">Obteniendo GPS...</span>
      </div>

      <!-- Cámara y Selfie de Verificación -->
      <label>Evidencia Fotográfica Facial</label>
      <div class="camera-container">
        <video id="camera-stream" autoplay playsinline></video>
        <img id="captured-preview" alt="Foto Asistencia">
      </div>

      <div class="camera-actions">
        <button type="button" class="btn btn-secondary" id="btn-capturar-foto">📸 Tomar Foto</button>
        <button type="button" class="btn btn-secondary" id="btn-retomar-foto" style="display: none;">🔄 Reintentar</button>
      </div>

      <button type="button" class="btn btn-primary" id="btn-registrar" disabled style="margin-top: 0.75rem;">
        Registrar Asistencia
      </button>
    </div>

    <!-- Feed de Últimas Asistencias -->
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>Marcajes Recientes (Hoy)</span>
      </div>
      <div id="history-container">
        <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 0.5rem 0;">Cargando registros...</div>
      </div>
    </div>

  </div>

  <canvas id="hidden-canvas" style="display: none;"></canvas>

  <script type="module">
    import { db, collection, addDoc, onSnapshot, query, where, doc, getDoc } from "./js/firebase-config.js";
    import { protegerVista } from "./js/rbac.js";

    // Elementos DOM
    const selectProyecto = document.getElementById("select-proyecto");
    const geoBadge = document.getElementById("geo-badge");
    const geoDistanciaLabel = document.getElementById("geo-distancia-label");
    const btnCapturarFoto = document.getElementById("btn-capturar-foto");
    const btnRetomarFoto = document.getElementById("btn-retomar-foto");
    const cameraStream = document.getElementById("camera-stream");
    const capturedPreview = document.getElementById("captured-preview");
    const canvas = document.getElementById("hidden-canvas");
    const btnRegistrar = document.getElementById("btn-registrar");
    const historyContainer = document.getElementById("history-container");
    const btnEntrada = document.getElementById("btn-tipo-entrada");
    const btnSalida = document.getElementById("btn-tipo-salida");

    let usuarioActual = null;
    let perfilActual = null;
    let proyectosList = [];
    let mediaStreamObj = null;
    let fotoBase64 = null;
    let tipoMarcaje = "entrada";

    let gpsValido = false;
    let distanciaActualMts = null;
    let userCoords = null;

    // 1. Proteger Vista mediante RBAC
    protegerVista("checador", "c").then(({ user, perfil }) => {
      usuarioActual = user;
      perfilActual = perfil;
      iniciarModulo();
    });

    async function iniciarModulo() {
      await cargarProyectos();
      iniciarCamara();
      escucharHistorialHoy();
    }

    // 2. Selección de Marcaje
    btnEntrada.addEventListener("click", () => {
      tipoMarcaje = "entrada";
      btnEntrada.classList.add("selected");
      btnSalida.classList.remove("selected");
    });
    btnSalida.addEventListener("click", () => {
      tipoMarcaje = "salida";
      btnSalida.classList.add("selected");
      btnEntrada.classList.remove("selected");
    });

    // 3. Cargar Proyectos según Alcance
    function cargarProyectos() {
      return new Promise((resolve) => {
        onSnapshot(collection(db, "proyectos"), (snap) => {
          selectProyecto.innerHTML = '<option value="">-- Selecciona una Obra --</option>';
          proyectosList = [];

          snap.forEach((d) => {
            const p = { id: d.id, ...d.data() };
            // Filtro por alcance
            if (perfilActual.is_superadmin || perfilActual.alcance === "global" || perfilActual.proyectos_asignados?.includes(d.id) || perfilActual.proyectos_asignados?.includes("*")) {
              proyectosList.push(p);
              const opt = document.createElement("option");
              opt.value = p.id;
              opt.textContent = `${p.codigo || ''} - ${p.nombre}`;
              selectProyecto.appendChild(opt);
            }
          });

          if (proyectosList.length > 0) {
            selectProyecto.selectedIndex = 1;
            evaluarGeocerca();
          }
          resolve();
        });
      });
    }

    selectProyecto.addEventListener("change", evaluarGeocerca);

    // 4. Geocerca: Haversine Formula
    function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radio de la Tierra en metros
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function evaluarGeocerca() {
      const proyectoId = selectProyecto.value;
      if (!proyectoId) {
        geoBadge.className = "status-badge badge-checking";
        geoBadge.textContent = "Elige una obra";
        geoDistanciaLabel.textContent = "Selecciona una obra para calcular";
        gpsValido = false;
        verificarHabilitacionEnvio();
        return;
      }

      const pSel = proyectosList.find(p => p.id === proyectoId);
      if (!pSel || !pSel.geocerca || !pSel.geocerca.lat || !pSel.geocerca.lng) {
        // Obra sin geocerca definida: Bypass seguro o advertencia
        geoBadge.className = "status-badge badge-ok";
        geoBadge.textContent = "Geocerca Abierta";
        geoDistanciaLabel.textContent = "Obra sin perímetro restringido";
        gpsValido = true;
        distanciaActualMts = 0;
        verificarHabilitacionEnvio();
        return;
      }

      geoBadge.className = "status-badge badge-checking";
      geoBadge.textContent = "Obteniendo GPS...";
      geoDistanciaLabel.textContent = "Localizando dispositivo...";

      if (!navigator.geolocation) {
        geoBadge.className = "status-badge badge-fail";
        geoBadge.textContent = "Sin soporte GPS";
        gpsValido = false;
        verificarHabilitacionEnvio();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userCoords = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            precision: pos.coords.accuracy
          };

          const radioTolerancia = pSel.geocerca.radio || 150; // Metros por defecto
          const dist = calcularDistanciaMetros(
            userCoords.lat,
            userCoords.lng,
            pSel.geocerca.lat,
            pSel.geocerca.lng
          );

          distanciaActualMts = dist;

          if (dist <= radioTolerancia || perfilActual.is_superadmin) {
            gpsValido = true;
            geoBadge.className = "status-badge badge-ok";
            geoBadge.textContent = `En Perímetro (${dist}m)`;
            geoDistanciaLabel.textContent = `A ${dist}m del centro (tolerancia: ${radioTolerancia}m)`;
          } else {
            gpsValido = false;
            geoBadge.className = "status-badge badge-fail";
            geoBadge.textContent = `Fuera (${dist}m)`;
            geoDistanciaLabel.textContent = `Estás a ${dist}m de la obra (máx. permitido ${radioTolerancia}m)`;
          }
          verificarHabilitacionEnvio();
        },
        (err) => {
          console.warn("Error GPS:", err);
          geoBadge.className = "status-badge badge-fail";
          geoBadge.textContent = "GPS Bloqueado";
          geoDistanciaLabel.textContent = "Activa la ubicación en tu navegador";
          gpsValido = false;
          verificarHabilitacionEnvio();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // 5. Cámara en Vivo
    async function iniciarCamara() {
      try {
        mediaStreamObj = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        cameraStream.srcObject = mediaStreamObj;
      } catch (err) {
        console.warn("Fallo acceso a cámara frontal, intentando cualquiera:", err);
        try {
          mediaStreamObj = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          cameraStream.srcObject = mediaStreamObj;
        } catch (innerErr) {
          alert("No se pudo iniciar la cámara. Concede permisos para continuar.");
        }
      }
    }

    btnCapturarFoto.addEventListener("click", () => {
      canvas.width = cameraStream.videoWidth || 480;
      canvas.height = cameraStream.videoHeight || 360;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(cameraStream, 0, 0, canvas.width, canvas.height);

      // Comprimir en JPEG ligero (0.65 de calidad)
      fotoBase64 = canvas.toDataURL("image/jpeg", 0.65);

      cameraStream.style.display = "none";
      capturedPreview.src = fotoBase64;
      capturedPreview.style.display = "block";

      btnCapturarFoto.style.display = "none";
      btnRetomarFoto.style.display = "inline-flex";

      verificarHabilitacionEnvio();
    });

    btnRetomarFoto.addEventListener("click", () => {
      fotoBase64 = null;
      capturedPreview.style.display = "none";
      cameraStream.style.display = "block";

      btnRetomarFoto.style.display = "none";
      btnCapturarFoto.style.display = "inline-flex";

      verificarHabilitacionEnvio();
    });

    // 6. Validación para habilitar el botón
    function verificarHabilitacionEnvio() {
      const proyectoSeleccionado = !!selectProyecto.value;
      const fotoCapturada = !!fotoBase64;
      btnRegistrar.disabled = !(proyectoSeleccionado && fotoCapturada && gpsValido);
    }

    // 7. Inyección de Marcaje en Firestore
    btnRegistrar.addEventListener("click", async () => {
      btnRegistrar.disabled = true;
      btnRegistrar.textContent = "Registrando en Firestore...";

      const proyectoId = selectProyecto.value;
      const proyectoNom = selectProyecto.options[selectProyecto.selectedIndex].text;

      const payload = {
        uid: usuarioActual.uid,
        usuarioNombre: perfilActual.nombre || usuarioActual.email,
        usuarioEmail: usuarioActual.email,
        proyectoId: proyectoId,
        proyectoNombre: proyectoNom,
        tipo: tipoMarcaje,
        distanciaMts: distanciaActualMts,
        coordenadas: userCoords || { lat: 0, lng: 0 },
        foto: fotoBase64,
        timestamp: new Date().toISOString(),
        fechaCorta: new Date().toISOString().split("T")[0]
      };

      try {
        await addDoc(collection(db, "asistencias"), payload);
        alert(`¡Asistencia de ${tipoMarcaje.toUpperCase()} guardada con éxito!`);
        
        // Reset Foto
        btnRetomarFoto.click();
        evaluarGeocerca();
      } catch (err) {
        console.error(err);
        alert("Error al guardar asistencia: " + err.message);
      } finally {
        btnRegistrar.disabled = false;
        btnRegistrar.textContent = "Registrar Asistencia";
      }
    });

    // 8. Historial Reactivo de Asistencias del Día
    function escucharHistorialHoy() {
      const hoy = new Date().toISOString().split("T")[0];
      const q = query(
        collection(db, "asistencias"),
        where("fechaCorta", "==", hoy)
      );

      onSnapshot(q, (snap) => {
        historyContainer.innerHTML = "";
        if (snap.empty) {
          historyContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 0.5rem 0;">Sin marcajes registrados hoy.</div>';
          return;
        }

        const asistencias = [];
        snap.forEach(d => asistencias.push({ id: d.id, ...d.data() }));
        // Orden descendente por hora
        asistencias.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        asistencias.forEach(a => {
          const hora = new Date(a.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const item = document.createElement("div");
          item.className = "history-item";
          item.innerHTML = `
            <div>
              <strong>${a.usuarioNombre}</strong>
              <div style="color: var(--text-muted); font-size: 0.75rem;">${a.proyectoNombre} (${a.distanciaMts ?? 0}m)</div>
            </div>
            <div style="text-align: right;">
              <span class="status-badge ${a.tipo === 'entrada' ? 'badge-ok' : 'badge-fail'}">
                ${a.tipo.toUpperCase()}
              </span>
              <div style="color: var(--text-muted); font-size: 0.75rem; margin-top: 2px;">${hora}</div>
            </div>
          `;
          historyContainer.appendChild(item);
        });
      }, (err) => console.warn("Error en historial:", err.message));
    }
  </script>
</body>
</html>
